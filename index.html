<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session 41: Props, map, if and ternary</title>

  <!-- React + ReactDOM + Babel (so JSX runs directly in the browser) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ================= Cart Component =================
    // Receives the whole array as one prop: allData
    function Cart({ allData }) {
      // Part 1: if / else inside map
      const withIfElse = allData.map(function (result) {
        if (result.id > 2) {
          return (
            <div key={result.id}>
              <h2>My Name is {result.firstName} {result.lastName}</h2>
              <h2>My color is {result.color}</h2>
              <h5>My id is {result.id}</h5>
              <hr />
            </div>
          );
        } else if (result.id === 1) {
          return <h1 key={result.id}>Hii</h1>;
        } else {
          return <h1 key={result.id}>Not In Range</h1>;
        }
      });

      // Part 2: same logic with nested ternary
      const withTernary = allData.map(function (result) {
        return result.id > 2 ? (
          <div key={result.id}>
            <h2>My Name is {result.firstName} {result.lastName}</h2>
            <h2>My color is {result.color}</h2>
            <h5>My id is {result.id}</h5>
            <hr />
          </div>
        ) : result.id === 1 ? (
          <h1 key={result.id}>Hii</h1>
        ) : (
          <h1 key={result.id}>Not In Range</h1>
        );
      });

      return (
        <section>
          <h3>Using if / else</h3>
          {withIfElse}
          <h3>Using ternary</h3>
          {withTernary}
        </section>
      );
    }

    // ================= App Component =================
    // Plain JS goes before the return
    const allData = [
      { id: 1, firstName: "Fares", lastName: "Ahmed", color: "black" },
      { id: 2, firstName: "Zaki", lastName: "Ali", color: "red" },
      { id: 3, firstName: "Mariam", lastName: "Hassan", color: "blue" },
      { id: 4, firstName: "Karim", lastName: "Mahmoud", color: "green" },
      { id: 5, firstName: "Fouad", lastName: "Saeed", color: "yellow" },
    ];

    function App() {
      return (
        <div className="App">
          <h1>Session 41: Props, map, if and ternary</h1>
          <Cart allData={allData} />
          <footer>Footer</footer>
        </div>
      );
    }

    // ================= Render =================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
