<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>react</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React, ReactDOM and Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    // Cart component
    function Cart({ allData }) {
      // if / else
      const withIfElse = allData.map(function (result) {
        if (result.id > 2) {
          return (
            <div key={result.id} className="bg-white border border-gray-200 rounded-lg p-4 mb-3">
              <h2 className="text-lg font-semibold">My Name is {result.firstName} {result.lastName}</h2>
              <h2 className="text-lg">My color is {result.color}</h2>
              <h5 className="text-sm text-gray-500 mt-1">My id is {result.id}</h5>
            </div>
          );
        } else if (result.id === 1) {
          return <h1 key={result.id} className="text-xl font-bold mb-3">Hii</h1>;
        } else {
          return <h1 key={result.id} className="text-xl font-bold mb-3">Not In Range</h1>;
        }
      });

      // ternary
      const withTernary = allData.map(function (result) {
        return result.id > 2 ? (
          <div key={result.id} className="bg-white border border-gray-200 rounded-lg p-4 mb-3">
            <h2 className="text-lg font-semibold">My Name is {result.firstName} {result.lastName}</h2>
            <h2 className="text-lg">My color is {result.color}</h2>
            <h5 className="text-sm text-gray-500 mt-1">My id is {result.id}</h5>
          </div>
        ) : result.id === 1 ? (
          <h1 key={result.id} className="text-xl font-bold mb-3">Hii</h1>
        ) : (
          <h1 key={result.id} className="text-xl font-bold mb-3">Not In Range</h1>
        );
      });

      return (
        <section>
          <h3 className="text-lg font-bold mt-8 mb-4 pb-2 border-b-2 border-gray-300">Using if / else</h3>
          {withIfElse}
          <h3 className="text-lg font-bold mt-8 mb-4 pb-2 border-b-2 border-gray-300">Using ternary</h3>
          {withTernary}
        </section>
      );
    }

    // Data
    const allData = [
      { id: 1, firstName: "Fares", lastName: "Ahmed", color: "black" },
      { id: 2, firstName: "Zaki", lastName: "Ali", color: "red" },
      { id: 3, firstName: "Mariam", lastName: "Hassan", color: "blue" },
      { id: 4, firstName: "Karim", lastName: "Mahmoud", color: "green" },
      { id: 5, firstName: "Fouad", lastName: "Saeed", color: "yellow" },
    ];

    // App component
    function App() {
      return (
        <div className="max-w-2xl mx-auto px-5 py-8">
          <h1 className="text-3xl font-bold text-center">Session 41: Props, map, if and ternary</h1>
          <Cart allData={allData} />
          <footer className="text-center text-gray-400 mt-10">Footer</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
